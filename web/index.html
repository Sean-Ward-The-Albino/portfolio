<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sean D. Ward</title>
  <meta name="description" content="Sean D. Ward builds software done right. Founder and CEO of Avlory, in San Diego. Walk through his worlds.">
  <meta name="theme-color" content="#0b0910">
  <link rel="icon" href="/img/avlory.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Outfit:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <a class="skip" href="#readout">Skip to the text</a>
  <div id="stage" aria-hidden="true"></div>

  <header class="top">
    <button class="brand" type="button" data-world="home" aria-label="Sean D. Ward, go home">
      <img src="/img/avlory.svg" alt="" width="22" height="22">
      <span>Sean D. Ward</span>
    </button>
    <p class="where" id="where" aria-live="polite"></p>
    <div class="tod" id="tod" hidden>
      <label for="todIn">Time in San Diego</label>
      <input id="todIn" type="range" min="0" max="24" step="0.25">
      <output id="todOut" for="todIn"></output>
    </div>
  </header>

  <main id="readout" class="readout" aria-live="polite">
    <div class="sub" id="sub">
      <button class="nav prev" id="prev" type="button" aria-label="Previous stop">‹</button>
      <p id="subText"></p>
      <div class="acts" id="acts"></div>
      <button class="nav next" id="next" type="button" aria-label="Next stop">›</button>
    </div>
  </main>

  <nav class="dots" id="dots" aria-label="Stops on this world"></nav>

  <div class="tools">
    <button class="tool" id="walk" type="button" aria-pressed="false">Walk</button>
    <button class="tool" id="read" type="button" aria-pressed="false">Aa</button>
  </div>
  <div class="stick" id="stick" hidden aria-hidden="true"><i></i></div>
  <p class="hint" id="hint"></p>

  <nav class="dock" id="dock" aria-label="Worlds">
    <button type="button" data-world="home">Home</button>
    <button type="button" data-world="story">Story</button>
    <button type="button" data-world="craft">Craft</button>
    <button type="button" data-world="life">Life</button>
    <button type="button" data-world="game">Game</button>
  </nav>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="bar"><span class="grab" aria-hidden="true"></span><button class="x" id="sheetX" type="button" aria-label="Close">×</button></div>
    <div class="in" id="sheetBody"></div>
  </div>

  <div class="veil" id="veil"><p id="veilText"></p></div>
  <div class="boot" id="boot"><img src="/img/avlory.svg" alt="" width="40" height="40"><p>Sean D. Ward</p></div>
  <noscript><p class="nojs">This site is a set of 3D worlds and needs JavaScript. Sean D. Ward is the founder and CEO of Avlory, in San Diego.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
