# What I'm working toward.
aspirations:
  - Lead Avlory to a diverse suite of products that empower the people who use them.
  - Build sustainable technology.
  - Contribute to open-source AI safety research.
  - Mentor the next generation of engineers.
  - Make information and tools accessible to everyone, whatever their background.

