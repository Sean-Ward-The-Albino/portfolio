# The About page. Every section is optional: delete one and it disappears from the page.

intro: >-
  Growing up in San Diego, my pursuit of growth has always been driven by the belief that knowledge and wisdom
  are boundless. All forms of intelligence are valuable, and the beauty of exploring past the edge of what we
  currently know is what makes learning infinitely possible. I find guidance in Stoicism, Existentialism and
  Epicureanism.

story:
  - heading: Resilience
    body: >-
      My interest in technology started early: taking phones apart, building computers, and teaching myself to
      code from age 10. I live with albinism. It limits my vision, hides my Dominican heritage, and has led to
      three bouts of skin cancer. I adapt and overcome every obstacle to the best of my ability, and I treat
      challenges as the thing that makes me stronger.
  - heading: The vision
    body: >-
      My goal is to empower people, built on the conviction that information is a human right. Avlory builds
      software that elevates technology as a tool for the person using it: transparent, privacy-focused, and
      in the user's control. Division of people is the greatest opponent humanity faces, and good tools can
      bring us together.

