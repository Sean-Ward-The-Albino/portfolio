server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml,text/plain
  forward-headers-strategy: native
  error:
    whitelabel:
      enabled: false
  servlet:
    encoding:
      force: true
spring:
  application:
    name: seanward-site
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 45MB
  mvc:
    async:
      # The Game planet's live updates are long-lived; this is the most any one may last.
      request-timeout: 30m

site:
  # Where feedback, ratings, lanterns and content edits are saved.
  data-dir: ${SITE_DATA_DIR:data}
  # Starting content. When this file exists it's read at startup, so edits to it show after a restart.
  content-file: ${SITE_CONTENT_FILE:../content/site.json}
  media:
    # A Cloud Storage bucket for uploaded photos and tracks. Empty: they're saved under data-dir/media.
    bucket: ${MEDIA_BUCKET:}
    # Optional: a CDN or custom domain in front of the bucket.
    public-base: ${MEDIA_PUBLIC_BASE:}
  admin:
    # Set this in production. Locally, leave it empty and a token is printed to the log at startup.
    token: ${ADMIN_TOKEN:}
  waverate:
    base-url: ${WAVERATE_API_BASE:https://identity-gateway-262264240934.us-central1.run.app}
    # Both are secrets. Without them the "just rated" shelf stays hidden.
    api-key: ${WAVERATE_API_KEY:}
    user-id: ${WAVERATE_UID:}
  turnstile:
    # When set, feedback must pass Cloudflare Turnstile.
    secret: ${TURNSTILE_SECRET:}

logging:
  level:
    root: info
